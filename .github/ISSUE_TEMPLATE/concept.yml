name: Concept task
description: Add or improve a concept page
labels: [concept]
body:
  - type: textarea
    id: context
    attributes:
      label: Context/problem
      description: What concept gap are you addressing?
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      value: |
        - [ ] Definition
        - [ ] Intuition
        - [ ] Assumptions
        - [ ] Connections to knowledge graph
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Acceptance criteria and expected outputs.
    validations:
      required: true
  - type: textarea
    id: reproducibility
    attributes:
      label: Reproducibility confirmation
      description: Confirm links, references, and related experiment consistency.
